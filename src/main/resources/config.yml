# MythicTools - config.yml
settings:
  unbreakable-tools: true
  particles: true
  sounds: true
  # max blocks a single swing may break
  max-drill-blocks: 9
  max-shovel-blocks: 9
  max-tree-blocks: 200
  max-fluid-blocks: 27
  # ticks between cascading tree breaks (0 = instant)
  tree-delay-ticks: 1

self-destruct:
  check-interval-ticks: 20
  players-per-tick: 8
  # two lore lines appended to timed items: a static header + the live countdown
  header: "&7Self Destruct"
  time-color: "&f"
  # delayed mode: timer starts after this many minutes of first use
  default-delay-minutes: 1

sell:
  # used by the Sell-Axe when Vault economy is present
  prices:
    DIAMOND: 100.0
    EMERALD: 80.0
    GOLD_INGOT: 25.0
    IRON_INGOT: 12.0
    COPPER_INGOT: 4.0
    COAL: 3.0
    REDSTONE: 2.0
    LAPIS_LAZULI: 3.0
    AMETHYST_SHARD: 15.0
    COBBLESTONE: 0.5
    DEEPSLATE: 0.5

tools:
  drill:
    material: NETHERITE_PICKAXE
    name: "&d&lAMETHYST DRILL"
    lore:
      - "&7Breaks A 3x3 Area Instantly"
    enchants: ["efficiency:5", "unbreaking:3", "fortune:3", "mending:1"]
  axe:
    material: NETHERITE_AXE
    name: "&d&lAMETHYST AXE"
    lore:
      - "&7Chops The Whole Tree In One Swing"
    enchants: ["efficiency:5", "unbreaking:3", "mending:1"]
  shovel:
    material: NETHERITE_SHOVEL
    name: "&d&lAMETHYST SHOVEL"
    lore:
      - "&7Clears A 3x3 Area Of Soft Blocks"
    enchants: ["efficiency:5", "unbreaking:3", "mending:1"]
  sellaxe:
    material: NETHERITE_AXE
    name: "&d&lAMETHYST SELL AXE"
    lore:
      - "&7Instantly Sells All Items In A Chest"
    enchants: ["efficiency:5", "unbreaking:3", "mending:1"]
  bucket:
    material: BUCKET
    name: "&d&lAMETHYST BUCKET"
    lore:
      - "&7Drains Up To 27 Fluid Blocks"
    enchants: []
  multitool:
    material: NETHERITE_PICKAXE
    name: "&d&lAMETHYST MULTI-TOOL"
    lore:
      - "&7Acts As Pickaxe, Axe Or Shovel"
    enchants: ["efficiency:5", "unbreaking:3", "fortune:3", "mending:1"]
  firework:
    material: FIREWORK_ROCKET
    name: "&d&lAMETHYST FIREWORK"
    lore:
      - "&7Infinite Elytra Boost"
    enchants: []

messages:
  prefix: "&d&lMythicTools &8» &r"
  no-permission: "&cYou may not do that."
  usage: "&7/mt give <tool> [player] &8| &7/mt selfdestruct [-1] <time> &8| &7/mt reload"
  reloaded: "&aConfig reloaded."
  given: "&aGave &d%tool% &ato &f%player%&a."
  unknown-tool: "&cUnknown tool: &f%tool%"
  hold-item: "&cHold an item first."
  timer-set: "&aTimer set: &f%time%"
  timer-delayed: "&aTimer will start &f%time% &aafter first use."
  bad-time: "&cInvalid time. Example: &f1d5h30m"
  expired: "&c%item% &7has self-destructed."
  sold: "&aSold &f%amount% &aitems for &f$%money%&a."
  sell-empty: "&cNothing worth selling in there."
  no-economy: "&cNo Vault economy found."
